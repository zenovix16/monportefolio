<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projets — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="min-h-full bg-[#F1F2F4] text-[#14161A] antialiased">
  <div class="min-h-screen flex">
    <aside id="admin-sidebar" class="w-56 shrink-0 border-r border-black/[0.08] flex flex-col py-8 px-4"></aside>
    <main class="flex-1 overflow-auto p-8">
      <div class="flex items-center justify-between mb-10">
        <div>
          <p class="text-xs tracking-[0.3em] uppercase text-black/45 mb-2">Contenu</p>
          <h1 class="text-3xl font-bold text-[#14161A]">Projets</h1>
        </div>
        <button id="toggle-form" class="glow px-4 py-2.5 bg-[var(--accent)] text-white text-sm font-medium rounded-lg hover:bg-[var(--accent-light)] transition-colors">+ Nouveau projet</button>
      </div>

      <form id="project-form" class="glass rounded-lg p-6 mb-6 hidden">
        <p id="form-title" class="text-sm font-medium text-[#14161A] mb-5">Ajouter un projet</p>
        <div class="space-y-3">
          <input name="title" placeholder="Titre *" required class="w-full glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
          <textarea name="description" placeholder="Description *" required rows="3" class="w-full glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none resize-none"></textarea>
          <input name="tags" placeholder="Tags (séparés par virgule)" class="w-full glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
          <div class="grid grid-cols-2 gap-3">
            <input name="githubUrl" placeholder="URL GitHub" class="glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
            <input name="liveUrl" placeholder="URL Live" class="glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
          </div>

          <div class="glass rounded-lg p-4">
            <p class="text-xs text-black/50 mb-3">Image du projet</p>
            <p id="current-image" class="text-xs text-black/60 mb-2 hidden"></p>
            <label class="cursor-pointer inline-flex items-center gap-3">
              <span id="upload-label" class="text-xs text-black/60 border border-black/[0.1] rounded-lg px-3 py-2 hover:border-[var(--accent)]/50 transition-colors">Choisir une image</span>
              <input type="file" id="image-input" accept="image/*" class="hidden" />
            </label>
          </div>

          <div class="flex items-center justify-between">
            <label class="flex items-center gap-3 text-sm text-black/65 cursor-pointer">
              <input type="checkbox" name="featured" class="accent-[var(--accent)]" /> Featured
            </label>
            <input type="number" name="order" value="0" placeholder="Ordre" class="w-24 glass rounded-lg px-3 py-2 text-sm text-[#14161A] outline-none" />
          </div>

          <button type="submit" id="form-submit" class="glow w-full py-3 bg-[var(--accent)] text-white text-sm font-medium rounded-lg hover:bg-[var(--accent-light)] transition-colors">Créer le projet</button>
        </div>
      </form>

      <div id="items-list" class="space-y-3"></div>
    </main>
  </div>
  <script type="module" src="/src/js/admin/projects.js"></script>
</body>
</html>
