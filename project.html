<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Projet — Soumaïla Niampa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="min-h-full bg-[#F1F2F4] text-[#14161A] antialiased">

  <header class="fixed top-0 inset-x-0 h-14 border-b border-black/[0.08] bg-[#F1F2F4]/85 backdrop-blur-lg z-50 flex items-center justify-between px-5 md:px-10">
    <a href="/" class="text-[11px] tracking-[0.3em] uppercase text-black/45 hover:text-black/75 transition-colors font-medium">SN</a>
    <a href="/#projects" class="btn-ghost px-4 py-2 text-black/60 text-xs rounded-lg hover:text-black transition-colors">← Portfolio</a>
  </header>
  <div class="h-14" aria-hidden="true"></div>

  <main class="px-5 md:px-10 py-10 md:py-16 max-w-3xl mx-auto">
    <div id="state-loading" class="animate-pulse space-y-4">
      <div class="h-56 md:h-72 rounded-lg bg-black/[0.05]"></div>
      <div class="h-8 w-2/3 rounded bg-black/[0.05]"></div>
      <div class="h-4 w-full rounded bg-black/[0.05]"></div>
      <div class="h-4 w-5/6 rounded bg-black/[0.05]"></div>
    </div>

    <div id="state-notfound" class="hidden text-center py-16">
      <p class="mono text-[10px] tracking-[0.3em] uppercase text-black/40 mb-3">404</p>
      <h1 class="text-2xl font-bold text-[#14161A] mb-3">Projet introuvable.</h1>
      <p class="text-black/55 text-sm mb-6">Ce projet n'existe pas ou a été retiré.</p>
      <a href="/#projects" class="glow inline-block px-5 py-2.5 bg-[var(--accent)] text-white text-xs font-semibold rounded-lg hover:bg-[var(--accent-light)] transition-colors">Retour aux projets</a>
    </div>

    <article id="state-content" class="hidden" data-animate="fade"></article>
  </main>

  <footer class="border-t border-black/[0.08] px-5 md:px-10 py-8 mt-8">
    <div class="max-w-3xl mx-auto flex flex-col-reverse sm:flex-row items-center justify-between gap-4">
      <p class="text-black/35 text-xs">© <span id="footer-year"></span> Soumaïla Niampa</p>
      <a href="/#projects" class="btn-ghost text-black/55 hover:text-black text-xs rounded-lg px-4 py-2 transition-colors">← Retour aux projets</a>
    </div>
  </footer>

  <script type="module" src="/src/js/project-detail.js"></script>
</body>
</html>
