<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Connexion — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="min-h-full bg-[#F1F2F4] text-[#14161A] antialiased">
  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-10">
        <p class="text-xs tracking-[0.3em] uppercase text-black/45 mb-3">Admin</p>
        <h1 class="text-2xl font-bold text-[#14161A]">Connexion</h1>
      </div>

      <form id="login-form" class="space-y-3">
        <input type="email" name="email" placeholder="Email" required
          class="w-full glass rounded-lg px-4 py-3.5 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
        <input type="password" name="password" placeholder="Mot de passe" required
          class="w-full glass rounded-lg px-4 py-3.5 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
        <button type="submit" id="login-submit"
          class="glow w-full py-3.5 bg-[var(--accent)] text-white text-sm font-medium rounded-lg hover:bg-[var(--accent-light)] transition-colors disabled:opacity-50">
          Se connecter
        </button>
        <p id="login-error" class="text-center text-sm text-red-600/80 hidden">Identifiants incorrects.</p>
      </form>
    </div>
  </div>

  <script type="module" src="/src/js/admin/login.js"></script>
</body>
</html>
