<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Dashboard — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="min-h-full bg-[#F1F2F4] text-[#14161A] antialiased">
  <div class="min-h-screen flex">
    <aside id="admin-sidebar" class="w-56 shrink-0 border-r border-black/[0.08] flex flex-col py-8 px-4"></aside>
    <main class="flex-1 overflow-auto p-8">
      <div class="mb-10">
        <p class="text-xs tracking-[0.3em] uppercase text-black/45 mb-2">Vue d'ensemble</p>
        <h1 class="text-3xl font-bold text-[#14161A]">Dashboard</h1>
      </div>
      <div id="stats-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10"></div>
      <div class="glass rounded-lg p-6">
        <p class="mono text-xs tracking-[0.3em] uppercase text-black/45 mb-4">Accès rapide</p>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
          <a href="/admin/messages.html" class="text-sm text-black/60 hover:text-[var(--accent-light)] border border-black/[0.08] hover:border-[var(--accent)]/40 rounded-lg px-4 py-3 transition-all">Voir les messages →</a>
          <a href="/admin/projects.html" class="text-sm text-black/60 hover:text-[var(--accent-light)] border border-black/[0.08] hover:border-[var(--accent)]/40 rounded-lg px-4 py-3 transition-all">Ajouter un projet →</a>
          <a href="/admin/articles.html" class="text-sm text-black/60 hover:text-[var(--accent-light)] border border-black/[0.08] hover:border-[var(--accent)]/40 rounded-lg px-4 py-3 transition-all">Ajouter un article →</a>
          <a href="/admin/experience.html" class="text-sm text-black/60 hover:text-[var(--accent-light)] border border-black/[0.08] hover:border-[var(--accent)]/40 rounded-lg px-4 py-3 transition-all">Modifier l'expérience →</a>
          <a href="/admin/skills.html" class="text-sm text-black/60 hover:text-[var(--accent-light)] border border-black/[0.08] hover:border-[var(--accent)]/40 rounded-lg px-4 py-3 transition-all">Modifier les skills →</a>
          <a href="/" class="text-sm text-black/60 hover:text-[var(--accent-light)] border border-black/[0.08] hover:border-[var(--accent)]/40 rounded-lg px-4 py-3 transition-all">Voir le portfolio →</a>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/js/admin/dashboard.js"></script>
</body>
</html>
