<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Articles — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="min-h-full bg-[#F1F2F4] text-[#14161A] antialiased">
  <div class="min-h-screen flex">
    <aside id="admin-sidebar" class="w-56 shrink-0 border-r border-black/[0.08] flex flex-col py-8 px-4"></aside>
    <main class="flex-1 overflow-auto p-8">
      <div class="flex items-center justify-between mb-10">
        <div>
          <p class="text-xs tracking-[0.3em] uppercase text-black/45 mb-2">Publications</p>
          <h1 class="text-3xl font-bold text-[#14161A]">Articles scientifiques</h1>
        </div>
        <button id="toggle-form" class="glow px-4 py-2.5 bg-[var(--accent)] text-white text-sm font-medium rounded-lg hover:bg-[var(--accent-light)] transition-colors">+ Nouvel article</button>
      </div>

      <form id="article-form" class="glass rounded-lg p-6 mb-6 hidden">
        <div class="space-y-3">
          <input name="title" placeholder="Titre *" required class="w-full glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
          <textarea name="abstract" placeholder="Résumé / Abstract *" required rows="4" class="w-full glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none resize-none"></textarea>
          <div class="grid grid-cols-2 gap-3">
            <input name="journal" placeholder="Journal / Conférence" class="glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
            <input name="publishedDate" placeholder="Date (ex: 2024-03)" class="glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input name="authors" placeholder="Auteurs (séparés par virgule)" class="glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
            <input name="tags" placeholder="Tags (séparés par virgule)" class="glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <input name="doi" placeholder="DOI" class="glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
            <input name="pdfUrl" placeholder="URL du PDF" class="glass rounded-lg px-4 py-3 text-sm text-[#14161A] placeholder:text-black/35 outline-none" />
          </div>
          <label class="flex items-center gap-3 text-sm text-black/65 cursor-pointer">
            <input type="checkbox" name="featured" class="w-4 h-4 accent-[var(--accent)]" /> Mettre en avant (featured)
          </label>
          <button type="submit" id="form-submit" class="glow w-full py-3 bg-[var(--accent)] text-white text-sm font-medium rounded-lg hover:bg-[var(--accent-light)] transition-colors">Publier l'article</button>
        </div>
      </form>

      <div id="items-list" class="space-y-3"></div>
    </main>
  </div>
  <script type="module" src="/src/js/admin/articles.js"></script>
</body>
</html>
